apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: network-agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: network-agents/api:latest
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: network-agents-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: network-agents-config
              key: PORT
        - name: PUBLIC_MODE
          valueFrom:
            configMapKeyRef:
              name: network-agents-config
              key: PUBLIC_MODE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: network-agents-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: network-agents-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: network-agents-secrets
              key: redis-url
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: network-agents-secrets
              key: openai-api-key
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10

# NOTA: este ficheiro assume que o pipeline de deploy faz substituição
# de ${...} (envsubst/Helm/Kustomize) antes do kubectl apply.
# Ver EXECUTION-PROMPTS.md A1 — TODO: confirmar o pipeline real.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: network-agents
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16
        env:
        - name: POSTGRES_USER
          value: network
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: network-agents-secrets
              key: postgres-password
        - name: POSTGRES_DB
          value: network_agents
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

id: network-agents-setup-structural-enhancements
objective: Transformar o repositório numa infraestrutura de agentes leve, de uso gratuito
  e baixa capacidade, garantindo runtime 100% local, pacotes de domínio desacoplados,
  identidade e recibos locais, e triagem de dependências e documentação.
done_when:
- docs/STATUS.md exists
- config/areas.yaml exists
steps:
- id: s1
  action: resolver-p81-domain-packs
  task: Resolver P-81 opção A (_kb_for por config/areas.yaml) e estruturar Domain
    Packs como unidades de reutilização instaláveis e removíveis com contrato de CI.
  depends_on: []
- id: s2
  action: runtime-local-zero-infra
  task: Implementar o worker local OpenAI-compatível em external_worker.py (suporte
    a Ollama/llama.cpp) e garantir suporte a SQLite/filesystem como padrão (perfil
    edge).
  depends_on:
  - s1
- id: s3
  action: nucleo-minimo-extras
  task: Criar pyproject.toml isolando o núcleo leve (PyYAML, jsonschema, httpx) e
    definindo extras para rag, mcp e langgraph, reduzindo o tamanho de instalação
    abaixo de 50 MB.
  depends_on:
  - s2
- id: s4
  action: cortar-peso-morto-e-triagem
  task: Remover ou arquivar pastas não utilizadas (vendor, oss, pacotes legados) após
    validação por grep/CI, e triar o passivo documental em PENDENCIAS.md reduzindo
    os itens bloqueados.
  depends_on:
  - s3
- id: s5
  action: governanca-local-e-benchmarks
  task: Implementar primitivas locais de identidade, Delegation Graph, Action Receipts
    encadeados via SQLite/JSONL e criar o benchmark tiny golden para validação de
    custo e execução.
  depends_on:
  - s4

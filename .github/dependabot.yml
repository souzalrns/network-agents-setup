version: 2

updates:
  # Python (runner)
  - package-ecosystem: "pip"
    directory: "/runner"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Node: workspace pnpm inteiro (packages/* e apps/*), com um só pnpm-lock.yaml na raiz.
  # Não repetir entradas por pasta (apps/api, packages/*): o Dependabot abria PRs sem o lockfile,
  # que falhavam no `pnpm install --frozen-lockfile` (ex.: #207 e #208, duplicados de #206 e #210).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "node"

  # Node (oss/economia-trader/terminal): projecto npm à parte, com package-lock.json próprio
  - package-ecosystem: "npm"
    directory: "/oss/economia-trader/terminal"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "node"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "github-actions"

name: planwright

# oss/planwright: a pluggable "maker of plans" — a Markdown plan in, the schedule
# (ready / parallel / critical path) out. Self-contained, zero runtime deps, so it
# can move to its own repository unchanged (like skill-scout and auditron).
#
# - test: Python 3.10 and 3.13; ruff lint + format; pytest (stdlib only, nothing skipped);
# - package: sdist + wheel, `twine check --strict`, install the wheel in a clean venv and run it.
#
# Public repository: Actions minutes are free. Actions pinned by SHA.

on:
  pull_request:
    branches: [main]
    paths:
      - 'oss/planwright/**'
      - '.github/workflows/planwright.yml'
      - 'scripts/regen_planos_visual.py'
      - 'docs/initiatives/PLANOS-AUTONOMOS.md'
  push:
    branches: [main]
    paths:
      - 'oss/planwright/**'
      - '.github/workflows/planwright.yml'
      - 'scripts/regen_planos_visual.py'
      - 'docs/initiatives/PLANOS-AUTONOMOS.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: planwright-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: oss/planwright

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[test]' ruff==0.16.9
      - name: Lint and format
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Tests (stdlib only; nothing is skipped)
        run: |
          python -m pytest tests -q -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .
          twine check --strict dist/*
      - name: Wheel contents (licences in, tests out)
        run: |
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q "licenses/LICENSE" wheel.txt && grep -q "licenses/NOTICE" wheel.txt
          ! grep -q "tests/" wheel.txt
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/pw
          /tmp/pw/bin/pip install dist/*.whl
          /tmp/pw/bin/planwright --version
          /tmp/pw/bin/planwright graph examples/PLAN.md
          /tmp/pw/bin/planwright validate examples/PLAN.md --strict
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: planwright-dist
          path: oss/planwright/dist/
          retention-days: 7

  doc-visual:
    # The embedded Mermaid graph/board + action plan in PLANOS-AUTONOMOS.md are
    # generated from its master table; fail if someone changed the table without
    # regenerating them (run: python scripts/regen_planos_visual.py).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Plan validates and its visual section is not stale
        run: |
          PYTHONPATH=oss/planwright/src python3 -m planwright.cli validate docs/initiatives/PLANOS-AUTONOMOS.md --strict
          python3 scripts/regen_planos_visual.py --check

name: CI

# Repositório público (github.com/souzalrns/network-agents-setup) — minutos de GitHub
# Actions em runners hospedados pelo GitHub são ilimitados e gratuitos para repos
# públicos, sem risco de estourar cota. Ver docs/STATUS.md para o contexto completo.
#
# Diferença importante deste ambiente de CI para o sandbox onde este pipeline foi
# desenvolvido: aqui o egress de rede NÃO é bloqueado, então `prisma generate` e
# `prisma db push` rodam de verdade (no sandbox de desenvolvimento, binaries.prisma.sh
# retorna 403 — ver docs/STATUS.md). Por isso este CI valida o pipeline contra um
# Postgres real com pgvector, não contra o harness fake usado durante o desenvolvimento.

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: network_agents_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/network_agents_ci
      # Opcional: se configurada em Settings > Secrets, os testes de embeddings/orquestrador
      # rodam completos. Sem ela, o smoke-test detecta a ausência e reporta "parcial" em vez
      # de falhar (ver packages/scripts/src/smoke-test.ts, hasRealApiKey()).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Sem "version:" aqui de propósito — o action-setup lê a versão do campo
        # "packageManager" do package.json raiz (pnpm@8.0.0). Especificar os dois ao
        # mesmo tempo é erro fatal do action ("Multiple versions of pnpm specified"),
        # descoberto na primeira execução real deste workflow no GitHub (run 32210472782).
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Sem "cache: pnpm" de propósito — essa opção exige pnpm-lock.yaml commitado
          # para funcionar como chave de cache, e ainda não temos um (ver TODO abaixo e
          # docs/STATUS.md). Sem cache o install é mais lento, mas funciona. Descoberto na
          # segunda execução real deste workflow no GitHub (run 32210560330).

      - name: Instalar dependências
        id: install
        # Sem pnpm-lock.yaml commitado ainda — --no-frozen-lockfile evita falha aqui.
        # TODO (docs/STATUS.md): commitar o lockfile para builds reprodutíveis.
        run: pnpm install --no-frozen-lockfile 2>&1 | tee /tmp/log-install.log
        continue-on-error: true

      - name: Habilitar extensão pgvector no banco de teste
        id: pgvector
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;" 2>&1 | tee /tmp/log-pgvector.log
        continue-on-error: true

      - name: Gerar Prisma Client
        id: prisma_generate
        run: pnpm --filter @network-agents/memory exec prisma generate 2>&1 | tee /tmp/log-prisma-generate.log
        continue-on-error: true

      - name: Aplicar schema Prisma ao banco de teste
        id: prisma_push
        run: pnpm --filter @network-agents/memory exec prisma db push --skip-generate --accept-data-loss 2>&1 | tee /tmp/log-prisma-push.log
        continue-on-error: true

      - name: Type-check (tsc --noEmit, todos os pacotes)
        id: typecheck
        run: pnpm run ci:typecheck 2>&1 | tee /tmp/log-typecheck.log
        continue-on-error: true

      - name: Consistência STATUS ↔ código ↔ agents.config
        id: consistency
        run: pnpm --filter @network-agents/scripts run validate:consistency 2>&1 | tee /tmp/log-consistency.log
        continue-on-error: true

      - name: Smoke test funcional (ingestão real contra Postgres real)
        id: smoke
        run: pnpm run ci:smoke-test 2>&1 | tee /tmp/log-smoke.log
        continue-on-error: true

      # DEBUG TEMPORÁRIO (remover depois de diagnosticado): o download do log completo
      # via API do GitHub redireciona para um blob (results-receiver.actions.githubusercontent.com
      # / *.blob.core.windows.net) que não está na allowlist de rede do sandbox onde este
      # workflow foi escrito, e WebFetch também é bloqueado pelo proxy nesse host. Publicar
      # como check-run próprio contorna isso — dá para ler via
      # `GET /repos/.../commits/{sha}/check-runs`, sem precisar do blob.
      - name: Publicar logs de qualquer passo que falhou (debug temporário)
        if: |
          steps.install.outcome == 'failure' || steps.pgvector.outcome == 'failure' ||
          steps.prisma_generate.outcome == 'failure' || steps.prisma_push.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' || steps.consistency.outcome == 'failure' ||
          steps.smoke.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = ['install', 'pgvector', 'prisma-generate', 'prisma-push', 'typecheck', 'consistency', 'smoke'];
            let summary = '';
            for (const f of files) {
              const path = `/tmp/log-${f}.log`;
              if (fs.existsSync(path)) {
                const content = fs.readFileSync(path, 'utf8').slice(-8000);
                summary += `### ${f}\n\`\`\`\n${content}\n\`\`\`\n\n`;
              }
            }
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'debug-ci-logs',
              head_sha: context.sha,
              status: 'completed',
              conclusion: 'neutral',
              output: { title: 'Logs dos passos do CI', summary: summary.slice(0, 65000) },
            });

      - name: Falhar o job se algum passo falhou
        if: |
          steps.install.outcome == 'failure' || steps.pgvector.outcome == 'failure' ||
          steps.prisma_generate.outcome == 'failure' || steps.prisma_push.outcome == 'failure' ||
          steps.typecheck.outcome == 'failure' || steps.consistency.outcome == 'failure' ||
          steps.smoke.outcome == 'failure'
        run: exit 1

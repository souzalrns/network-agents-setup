name: ingest-knowledge
on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/ingest_apply.py"
      - "scripts/ingest_delta.py"
  workflow_dispatch:

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r runner/requirements.txt
          python -m pip install psycopg[binary] httpx

      - name: Dry-run delta (hashes)
        run: python scripts/ingest_delta.py --dry-run

      - name: Apply delta (embed + Supabase)
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/ingest_apply.py
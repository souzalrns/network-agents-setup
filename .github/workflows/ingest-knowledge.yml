      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      #     GITHUB_SHA: ${{ github.sha }}
      #   run: python scripts/ingest_delta.py --apply

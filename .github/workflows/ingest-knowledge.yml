name: ingest-knowledge
on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/ingest_apply.py"
      - "scripts/ingest_delta.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (era @v4)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0 (era @v5)
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r runner/requirements.txt
          python -m pip install psycopg[binary] httpx

      - name: Dry-run delta (hashes)
        run: python scripts/ingest_delta.py --dry-run

      - name: Apply delta (embed + Supabase)
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/ingest_apply.py
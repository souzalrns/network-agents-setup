name: ingest-knowledge
on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/ingest_apply.py"
      - "scripts/ingest_delta.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest-knowledge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (H-003: Node 24; era v4.4.0)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (H-003: Node 24; era v5.6.0)
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r runner/requirements.txt
          python -m pip install psycopg[binary] httpx

      - name: Dry-run delta (hashes)
        run: python scripts/ingest_delta.py --dry-run

      - name: Apply delta (embed + Supabase)
        if: github.event_name == 'push'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/ingest_apply.py
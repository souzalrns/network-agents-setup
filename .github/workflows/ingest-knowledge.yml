name: ingest-knowledge
on:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "scripts/ingest_delta.py"
  workflow_dispatch:

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry-run delta (hashes)
        run: python scripts/ingest_delta.py --dry-run
      # When Supabase + ingest_knowledge are wired:

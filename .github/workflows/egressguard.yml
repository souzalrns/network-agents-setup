name: egressguard

# oss/egressguard: um GET HTTP seguro acoplável (allowlist deny-by-default + SSRF + robots + tectos).
# Auto-contido, para sair para o seu próprio repositório sem mudanças (como o skill-scout).
#
# - test: Python 3.10 e 3.13; ruff lint + format; pytest (o único dep de runtime é o httpx);
# - package: sdist + wheel, `twine check --strict`, instalar o wheel num venv limpo e correr.
#
# Repositório público: minutos de Actions grátis. Actions fixadas por SHA.

on:
  pull_request:
    branches: [main]
    paths:
      - 'oss/egressguard/**'
      - '.github/workflows/egressguard.yml'
  push:
    branches: [main]
    paths:
      - 'oss/egressguard/**'
      - '.github/workflows/egressguard.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: egressguard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: oss/egressguard

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[test]' ruff==0.16.9
      - name: Lint and format
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Tests (nada é saltado)
        run: |
          python -m pytest tests -q -rs | tee pytest.log
          ! grep -q "SKIPPED" pytest.log

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build --outdir dist .
          twine check --strict dist/*
      - name: Wheel contents (licenças dentro, testes fora)
        run: |
          python -m zipfile -l dist/*.whl | tee wheel.txt
          grep -q "licenses/LICENSE" wheel.txt && grep -q "licenses/NOTICE" wheel.txt
          ! grep -q "tests/" wheel.txt
      - name: Install the wheel in a clean venv and run it (deny-by-default)
        run: |
          python -m venv /tmp/fg
          /tmp/fg/bin/pip install dist/*.whl
          /tmp/fg/bin/egressguard --version
          # sem --allow => recusa (exit 2); host fora da allowlist => recusa (exit 1)
          /tmp/fg/bin/egressguard get https://x.test/ && { echo "::error::should require --allow"; exit 1; } || true
          /tmp/fg/bin/egressguard get https://x.test/ --allow other.test && { echo "::error::should block"; exit 1; } || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: egressguard-dist
          path: oss/egressguard/dist/
          retention-days: 7

name: Runner tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
      # E7: o validador do areas.yaml tem de correr quando mudam os agentes ou o YAML.
      - 'agents/**'
      - 'config/areas.yaml'
      - 'config/router-golden.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
      # E7: o validador do areas.yaml tem de correr quando mudam os agentes ou o YAML.
      - 'agents/**'
      - 'config/areas.yaml'
      - 'config/router-golden.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-langgraph.txt
          python -m pip install pytest

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check plan_runner/ tests/

      - name: Validar config/areas.yaml contra agents/ (E7)
        run: python -m plan_runner.areas

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=plan_runner \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: runner/coverage.xml
          flags: runner
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Testes marcados `slow` (planos reais por subprocess, LangGraph, crash recovery):
  # o pytest.ini exclui-os por omissao (`addopts = -m "not slow"`) para o uso local
  # ficar rapido, por isso o job `test` nunca os corria. Job a parte, em paralelo:
  # o CI demora o mesmo e o default local nao muda. ~2-3 min (PLANO item 10, parte Python).
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-langgraph.txt
          python -m pip install pytest

      # `-m slow` na linha de comando substitui o `-m "not slow"` do addopts.
      # 0 testes recolhidos = codigo de saida 5 = job vermelho (nunca passa em vazio).
      - name: Run slow tests
        run: python -m pytest tests/ -m slow -v --durations=10

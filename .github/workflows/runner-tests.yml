name: Runner tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
      # E7: o validador do areas.yaml tem de correr quando mudam os agentes ou o YAML.
      - 'agents/**'
      - 'config/areas.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
      # E7: o validador do areas.yaml tem de correr quando mudam os agentes ou o YAML.
      - 'agents/**'
      - 'config/areas.yaml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-langgraph.txt
          python -m pip install pytest

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check plan_runner/ tests/

      - name: Validar config/areas.yaml contra agents/ (E7)
        run: python -m plan_runner.areas

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=plan_runner \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: runner/coverage.xml
          flags: runner
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
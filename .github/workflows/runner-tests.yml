name: Runner tests

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
      # E7: o validador do areas.yaml tem de correr quando mudam os agentes ou o YAML.
      - 'agents/**'
      - 'config/areas.yaml'
      - 'config/router-golden.yaml'
      # ingest real usado pelo job test-rag
      - 'scripts/ingest_apply.py'
      - 'scripts/ingest_delta.py'
      # F1: primitiva ingest_document (testada pelo job test-ingest)
      - 'scripts/ingest_document.py'
      - 'scripts/ingest_benchmark.py'
      # L4 (D3): SQL versionado testado pelo job test-rag
      - 'scripts/create_memory_l4_table.sql'
      - 'scripts/create_recall_l4_rpc.sql'
      # AU-11: DDL canónico do RAG, carregado pelo test_rag_canonical.py
      - 'scripts/rag_schema.sql'
      # Bloco C: paineis de conselho (validados pelo E7) e migracao do ledger
      - 'config/councils.yaml'
      # Security pipeline: capabilities e skills validadas pelo E7; plano demo testado
      - 'config/*-capabilities.yaml'
      - 'skills/**'
      # .claude/skills/ e copia gerada de skills/ (test_claude_skills_sync.py)
      - '.claude/skills/**'
      - 'scripts/sync_claude_skills.py'
      - 'docs/orchestration/**/*.plan.yaml'
      - 'scripts/alter_token_usage_council_kinds.sql'
  pull_request:
    branches: [main]
    paths:
      - 'runner/**'
      - '.github/workflows/runner-tests.yml'
      # E7: o validador do areas.yaml tem de correr quando mudam os agentes ou o YAML.
      - 'agents/**'
      - 'config/areas.yaml'
      - 'config/router-golden.yaml'
      # ingest real usado pelo job test-rag
      - 'scripts/ingest_apply.py'
      - 'scripts/ingest_delta.py'
      # F1: primitiva ingest_document (testada pelo job test-ingest)
      - 'scripts/ingest_document.py'
      - 'scripts/ingest_benchmark.py'
      # L4 (D3): SQL versionado testado pelo job test-rag
      - 'scripts/create_memory_l4_table.sql'
      - 'scripts/create_recall_l4_rpc.sql'
      # AU-11: DDL canónico do RAG, carregado pelo test_rag_canonical.py
      - 'scripts/rag_schema.sql'
      # Bloco C: paineis de conselho (validados pelo E7) e migracao do ledger
      - 'config/councils.yaml'
      # Security pipeline: capabilities e skills validadas pelo E7; plano demo testado
      - 'config/*-capabilities.yaml'
      - 'skills/**'
      # .claude/skills/ e copia gerada de skills/ (test_claude_skills_sync.py)
      - '.claude/skills/**'
      - 'scripts/sync_claude_skills.py'
      - 'docs/orchestration/**/*.plan.yaml'
      - 'scripts/alter_token_usage_council_kinds.sql'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runner

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (H-003: Node 24; era v4.4.0)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (H-003: Node 24; era v5.6.0)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-langgraph.txt
          python -m pip install pytest

      - name: Lint with ruff
        run: |
          python -m pip install ruff
          python -m ruff check plan_runner/ tests/

      - name: Validar config/areas.yaml contra agents/ (E7)
        run: python -m plan_runner.areas

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=plan_runner \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        # H-003: o envio da cobertura nao pode chumbar os testes. O
        # fail_ci_if_error: false nao apanha um crash da propria action (v4.6.0,
        # Node 20 forcado a Node 24): desde 2026-10-05 falha o handshake TLS
        # ("EPROTO ... SSL alert number 40") antes de enviar o que quer que seja.
        # A v5 e composite (sem runtime Node), o que deve acabar com o crash; o
        # continue-on-error fica como rede (H-003, 2026-10-05).
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5 (H-003: Node 24; composite; era v4.6.0)
        with:
          files: runner/coverage.xml
          flags: runner
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Testes marcados `slow` (planos reais por subprocess, LangGraph, crash recovery):
  # o pytest.ini exclui-os por omissao (`addopts = -m "not slow"`) para o uso local
  # ficar rapido, por isso o job `test` nunca os corria. Job a parte, em paralelo:
  # o CI demora o mesmo e o default local nao muda. ~2-3 min (PLANO item 10, parte Python).
  test-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (H-003: Node 24; era v4.4.0)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (H-003: Node 24; era v5.6.0)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-langgraph.txt
          python -m pip install pytest

      # `-m slow` na linha de comando substitui o `-m "not slow"` do addopts.
      # 0 testes recolhidos = codigo de saida 5 = job vermelho (nunca passa em vazio).
      - name: Run slow tests
        run: python -m pytest tests/ -m slow -v --durations=10

  # PLANO item 10: ingest -> retrieve de ponta a ponta contra Postgres + pgvector
  # descartavel (servico do job, nunca o Supabase). Ficheiro markdown ->
  # scripts/ingest_apply.py::apply_one (chunk_markdown -> embed -> replace_chunks)
  # -> match_knowledge como o agent-network-mcp o chama. Embedder falso
  # (deterministico, sem Gemini): custo zero. RAG_TEST_REQUIRED=1 faz da falta
  # da BD um erro, nao um skip -- o job nunca fica verde sem ter corrido.
  test-rag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: runner

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_ci
      RAG_TEST_REQUIRED: '1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (H-003: Node 24; era v4.4.0)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (H-003: Node 24; era v5.6.0)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: ingest -> retrieve (Postgres + pgvector, embedder falso)
        run: python -m pytest tests/test_rag_canonical.py -v -rs

      # L4 (D3): ciclo remember/recall/forget/promote + SQL (2x, idempotencia) + worker
      - name: memoria L4 (Postgres + pgvector, Gemini falso)
        run: python -m pytest tests/test_memory_l4.py tests/test_memory_l4_worker.py -v -rs

      # Bloco C: veredicto do conselho -> L4 candidate -> HITL -> active (criterio de DONE)
      - name: conselho + L4 (Postgres + pgvector, Gemini falso)
        run: python -m pytest tests/test_council_l4.py -v -rs

  # F1 (T6b): conversão real com o MarkItDown (runner/requirements-ingest.txt) e as fixtures
  # sintéticas versionadas (tests/fixtures/ingest/), com o gerador no pin exacto
  # (runner/requirements-fixtures.txt) para provar que a fixture é a saída do gerador.
  # INGEST_TEST_REQUIRED=1 faz da falta de uma dependência opcional um erro, não um skip:
  # o job nunca fica verde sem ter convertido. Sem rede nem credenciais.
  # T6e: Postgres + pgvector descartavel (como no test-rag) para o documento convertido
  # passar pelo T6 real (ingest_apply.apply_one, embedder falso) ate ao match_knowledge.
  test-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INGEST_TEST_REQUIRED: '1'
      RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rag_ci
      RAG_TEST_REQUIRED: '1'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (H-003: Node 24; era v4.4.0)

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 (H-003: Node 24; era v5.6.0)
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: runner/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-ingest.txt -r requirements-fixtures.txt
          python -m pip install pytest

      # T6d: testes de segurança de entrada (processo filho, timeout, RLIMIT_DATA)
      # T6e: encaixe no T6 (saída, validador da regra 3, chunker, ingest real -> retrieve)
      - name: ingest_document + fixtures + seguranca + pipeline T6 (MarkItDown real)
        run: >-
          python -m pytest -v -rs
          tests/test_ingest_document.py tests/test_ingest_fixtures.py tests/test_ingest_security.py
          tests/test_ingest_pipeline.py tests/test_ingest_pipeline_rag.py

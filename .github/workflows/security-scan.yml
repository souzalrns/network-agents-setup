name: Security scan (SEC-2)

# SEC-2 (opção A, maestro, 2026-10-03): gitleaks (segredos) + semgrep (SAST).
# Repo público: os minutos de Actions são gratuitos. Docs: docs/architecture/SECURITY-AGENTS.md.
#
# - gitleaks: histórico git COMPLETO, em cada PR e em cada push para main. Achados
#   históricos aceites estão em .gitleaksignore (com o motivo); qualquer fuga nova falha.
# - semgrep (regras open source semgrep/semgrep-rules, fixadas num commit; sem login,
#   sem registo, sem métricas):
#     - pull_request: só os achados NOVOS em relação à base do PR (--baseline-commit),
#       de severidade ERROR ou WARNING, falham o job;
#     - push para main / manual: varrimento completo, só relatório (linha de base de
#       2026-10-03: 85 achados; 65 depois do SEC-2c; 49 depois do SEC-2d, TODOS em código
#       arquivado pela D1 (packages/, apps/), e 0 em código activo. Triagem em SECURITY-AGENTS.md;
#       falsos positivos em código activo marcados com `nosemgrep` + motivo).
#
# Actions fixadas por SHA (o próprio semgrep marca tags mutáveis como risco de supply chain).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: v8.30.1
  SEMGREP_VERSION: 1.179.0
  SEMGREP_RULES_REF: a84ff9cc2453ca91d581380de4b8b3f272f6f4be

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # histórico completo

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.24'
          cache: false

      # go install verifica o módulo na base de checksums do Go (sum.golang.org)
      - name: Instalar gitleaks
        run: go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: gitleaks (histórico completo, valores redigidos)
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --exit-code 1 \
            --report-format json --report-path gitleaks-report.json .

      - name: Relatório (só se falhar; valores redigidos)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # o --baseline-commit precisa da base do PR

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Instalar semgrep e regras fixadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          git clone --filter=blob:none --quiet https://github.com/semgrep/semgrep-rules.git "${RUNNER_TEMP}/semgrep-rules"
          git -C "${RUNNER_TEMP}/semgrep-rules" checkout --quiet "${SEMGREP_RULES_REF}"

      - name: semgrep (PR, só achados novos ERROR/WARNING)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          R="${RUNNER_TEMP}/semgrep-rules"
          semgrep scan --metrics=off --disable-version-check \
            --config "$R/python" --config "$R/yaml/github-actions" --config "$R/generic/secrets" \
            --config "$R/javascript" --config "$R/typescript" \
            --baseline-commit "$BASE_SHA" --severity ERROR --severity WARNING --error .

      - name: semgrep (main / manual, varrimento completo, só relatório)
        if: github.event_name != 'pull_request'
        run: |
          R="${RUNNER_TEMP}/semgrep-rules"
          semgrep scan --metrics=off --disable-version-check \
            --config "$R/python" --config "$R/yaml/github-actions" --config "$R/generic/secrets" \
            --config "$R/javascript" --config "$R/typescript" \
            --json --output semgrep.json --quiet .
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          d = json.load(open("semgrep.json"))
          r = d["results"]
          # D1 (VIA A): apps/ e packages/ são TS arquivado (não apagado); achados lá = "arquivado, não aplicável"
          archived = ("packages/", "apps/")
          arch = [x for x in r if x["path"].startswith(archived)]
          active = [x for x in r if not x["path"].startswith(archived)]
          print(f"## semgrep: {len(r)} achados (linha de base depois do SEC-2d: 49, todos em código arquivado)\n")
          print(f"- **código activo: {len(active)}** (esperado 0; falsos positivos marcados com `nosemgrep` + motivo)")
          print(f"- código arquivado (D1: `packages/`, `apps/`): {len(arch)}, não aplicável e não bloqueia\n")
          for x in active:
              print(f"  - ACTIVO {x['extra']['severity']} `{x['check_id'].split('.')[-1]}` {x['path']}:{x['start']['line']}")
          print("| Severidade | Activo | Arquivado |\n|---|---:|---:|")
          for sev in ("ERROR", "WARNING", "INFO"):
              a = sum(1 for x in active if x["extra"]["severity"] == sev)
              b = sum(1 for x in arch if x["extra"]["severity"] == sev)
              print(f"| {sev} | {a} | {b} |")
          print("\n| Regra | N |\n|---|---:|")
          for rule, n in Counter(x["check_id"].split(".")[-1] for x in r).most_common(15):
              print(f"| {rule} | {n} |")
          PY

      - name: Relatório completo (main / manual)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-report
          path: semgrep.json
          retention-days: 14

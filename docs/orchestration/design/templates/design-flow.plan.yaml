# Template — design_flow (UX → UI → UX writing → critic → HITL)

id: template-design-flow
version: 2
deliverable_type: design_pack
objective: "(preencher — ex.: onboarding de cadastro)"
audience: "(preencher)"

budget:
  max_steps: 10
  max_replans: 2

steps:
  - id: ux
    action: ux_flow
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/01-ux-flow.md
    on_fail: human

  - id: ui
    action: ui_spec
    depends_on: [ux]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/01-ux-flow.md]
    output_artifact: artifacts/02-ui-spec.md
    on_fail: human

  - id: copy_ui
    action: ux_writing
    depends_on: [ux, ui]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/01-ux-flow.md, artifacts/02-ui-spec.md]
    output_artifact: artifacts/03-ux-writing.md
    on_fail: human

  - id: critic
    action: design_critic
    depends_on: [copy_ui]
    tools_allowed: [read_repo_file]
    inputs:
      - artifacts/01-ux-flow.md
      - artifacts/02-ui-spec.md
      - artifacts/03-ux-writing.md
    output_artifact: artifacts/04-design-critic.json
    on_fail: human

  - id: hitl
    action: plan_approve
    depends_on: [critic]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/05-hitl.json

done_when:
  - artifacts/01-ux-flow.md exists
  - artifacts/02-ui-spec.md exists
  - artifacts/03-ux-writing.md exists
  - artifacts/04-design-critic.json exists
  - human_gate_resolved on hitl

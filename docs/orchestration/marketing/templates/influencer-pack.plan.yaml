# Template — influencer_pack

id: template-influencer-pack
version: 1
deliverable_type: influencer_pack
# Entrega para fora (terceiros ou publicação): brief enviado a criadores
delivery: external
objective: "(preencher)"
audience: "(preencher)"

budget:
  max_steps: 6

steps:
  - id: brief
    action: influencer_brief
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/01-influencer-brief.md
    knowledge:
      kb: marketing
      query: "briefing de influenciador estrutura e critérios"

  - id: critic
    action: critic
    depends_on: [brief]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/01-influencer-brief.md]
    output_artifact: artifacts/02-critic.json
    knowledge:
      kb: marketing
      query: "rubrica de revisão criativa e critérios de qualidade"

  - id: compliance
    action: compliance_check
    depends_on: [brief]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/01-influencer-brief.md]
    output_artifact: artifacts/09-compliance.json
    knowledge:
      kb: marketing
      query: "regras de marca do cliente e conformidade legal da publicidade"

  - id: hitl
    action: plan_approve
    depends_on: [critic, compliance]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/03-hitl.json

done_when:
  - artifacts/01-influencer-brief.md exists
  - human_gate_resolved on hitl

# Template — social_pack (genérico)

id: template-social-pack
version: 1
deliverable_type: social_pack
# Entrega para fora (terceiros ou publicação): posts para as redes
delivery: external
objective: "(preencher)"
channels: []  # ex. instagram, tiktok

budget:
  max_steps: 10

steps:
  - id: trends
    action: trend_hunter
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/01-trends.md
    knowledge:
      kb: marketing
      query: "identificação de tendências redes sociais"

  - id: research
    action: research
    depends_on: [trends]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/02-research.md
    knowledge:
      kb: marketing
      query: "metodologia de pesquisa de marketing e fontes citáveis"

  - id: copy_social
    action: copy_social
    depends_on: [research]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/03-social-copy.md
    knowledge:
      kb: marketing
      query: "copywriting para redes sociais"

  - id: storytelling
    action: storytelling
    depends_on: [copy_social]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/04-story.md
    knowledge:
      kb: marketing
      query: "storytelling estrutura narrativa de marca"

  - id: critic
    action: critic
    depends_on: [storytelling]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/05-critic.json
    knowledge:
      kb: marketing
      query: "rubrica de revisão criativa e critérios de qualidade"

  - id: compliance
    action: compliance_check
    depends_on: [storytelling]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/03-social-copy.md, artifacts/04-story.md]
    output_artifact: artifacts/09-compliance.json
    knowledge:
      kb: marketing
      query: "regras de marca do cliente e conformidade legal da publicidade"

  - id: hitl
    action: plan_approve
    depends_on: [critic, compliance]
    human_gate:
      level: step
      kind: confirmation
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/06-hitl.json

done_when:
  - artifacts/03-social-copy.md exists
  - artifacts/05-critic.json exists
  - human_gate_resolved on hitl
  # publish em redes = sempre fora deste template sem approve explícito extra

# Template — área Vídeo & criativos (P-90 = B, M-006)
#
# O líder da área (marketing.lider_video) decide e entrega o brief; os especialistas da área
# recebem-no como input. Passos sem dependência entre si correm em paralelo (motor LangGraph).
# Qualidade (fase 2): critic e compliance revêem em paralelo antes da aprovação humana.

id: template-area-video
version: 1
deliverable_type: area_video
objective: "(preencher)"
audience: "(preencher)"

budget:
  max_steps: 10

steps:
  - id: lider
    action: lider_video
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/00-brief-video.md

  - id: guiao
    action: ugc_brief
    depends_on: [lider]
    task: "Guião do vídeo segundo o brief"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md]
    output_artifact: artifacts/01-guiao.md

  - id: producao
    action: video_production
    depends_on: [guiao]
    task: "Folha de produção: origem e custo de cada cena"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/01-guiao.md]
    output_artifact: artifacts/02-producao.md

  - id: imagem
    action: image
    depends_on: [guiao]
    task: "Imagens e capa para as cenas do guião"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/01-guiao.md]
    output_artifact: artifacts/03-imagem.md

  - id: audio
    action: audio_voice
    depends_on: [guiao]
    task: "Narração, música com licença e legendas"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/01-guiao.md]
    output_artifact: artifacts/04-audio.md

  - id: edicao
    action: video_edit_plan
    depends_on: [producao, imagem, audio]
    task: "Plano de edição a partir da produção, imagens e áudio"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/02-producao.md, artifacts/03-imagem.md, artifacts/04-audio.md]
    output_artifact: artifacts/05-edicao.md

  - id: versoes
    action: repurposing
    depends_on: [edicao]
    task: "Versões por rede a partir do plano de edição"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/05-edicao.md]
    output_artifact: artifacts/06-versoes.md

  - id: critic
    action: critic
    depends_on: [versoes]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/01-guiao.md, artifacts/02-producao.md, artifacts/03-imagem.md, artifacts/04-audio.md, artifacts/05-edicao.md, artifacts/06-versoes.md]
    output_artifact: artifacts/07-critic.json

  - id: compliance
    action: compliance_check
    depends_on: [versoes]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-video.md, artifacts/01-guiao.md, artifacts/02-producao.md, artifacts/03-imagem.md, artifacts/04-audio.md, artifacts/05-edicao.md, artifacts/06-versoes.md]
    output_artifact: artifacts/08-compliance.json

  - id: hitl
    action: plan_approve
    depends_on: [critic, compliance]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/09-hitl.json

done_when:
  - artifacts/00-brief-video.md exists
  - artifacts/01-guiao.md exists
  - artifacts/02-producao.md exists
  - artifacts/03-imagem.md exists
  - artifacts/04-audio.md exists
  - artifacts/05-edicao.md exists
  - artifacts/06-versoes.md exists
  - artifacts/08-compliance.json exists
  - human_gate_resolved on hitl

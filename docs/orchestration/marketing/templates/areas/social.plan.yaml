# Template — área Social & comunidade (P-90 = B, M-006)
#
# O líder da área (marketing.lider_social) decide e entrega o brief; os especialistas da área
# recebem-no como input. Passos sem dependência entre si correm em paralelo (motor LangGraph).
# Qualidade: critic e compliance (e, nos sites, a citabilidade por IA) revêem em paralelo antes da aprovação humana.

id: template-area-social
version: 1
deliverable_type: area_social
# Entrega para fora (terceiros ou publicação): posts e pacote de publicação para as redes
delivery: external
objective: "(preencher)"
audience: "(preencher)"

budget:
  max_steps: 8

steps:
  - id: lider
    action: lider_social
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/00-brief-social.md
    knowledge:
      kb: marketing
      query: "gestão de redes sociais, comunidade e influenciadores"

  - id: comunidade
    action: community_marketing
    mode: events
    depends_on: [lider]
    task: "Evento para a comunidade segundo o brief"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md]
    output_artifact: artifacts/01-comunidade.md
    knowledge:
      kb: marketing
      query: "marketing de comunidade e engagement"

  - id: criadores
    action: influencer_brief
    depends_on: [lider]
    task: "Brief para criadores locais"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md]
    output_artifact: artifacts/02-criadores.md
    knowledge:
      kb: marketing
      query: "briefing de influenciadores e criadores"

  - id: calendario
    action: editorial_calendar
    depends_on: [comunidade, criadores]
    task: "Calendário editorial das acções e peças"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md, artifacts/01-comunidade.md, artifacts/02-criadores.md]
    output_artifact: artifacts/03-calendario.md
    knowledge:
      kb: marketing
      query: "calendário editorial de conteúdo"

  - id: publicacao
    action: publish_package
    depends_on: [calendario]
    task: "Pacotes de publicação prontos a agendar (nada publicado)"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md, artifacts/03-calendario.md]
    output_artifact: artifacts/04-publicacao.json
    knowledge:
      kb: marketing
      query: "pacote de publicação por rede social (Instagram, TikTok)"

  - id: critic
    action: critic
    depends_on: [publicacao]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md, artifacts/01-comunidade.md, artifacts/02-criadores.md, artifacts/03-calendario.md, artifacts/04-publicacao.json]
    output_artifact: artifacts/05-critic.json
    knowledge:
      kb: marketing
      query: "rubrica de revisão criativa e critérios de qualidade"

  - id: compliance
    action: compliance_check
    depends_on: [publicacao]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md, artifacts/01-comunidade.md, artifacts/02-criadores.md, artifacts/03-calendario.md, artifacts/04-publicacao.json]
    output_artifact: artifacts/06-compliance.json
    knowledge:
      kb: marketing
      query: "regras de marca do cliente e conformidade legal da publicidade"

  - id: hitl
    action: plan_approve
    depends_on: [critic, compliance]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/07-hitl.json

done_when:
  - artifacts/00-brief-social.md exists
  - artifacts/01-comunidade.md exists
  - artifacts/02-criadores.md exists
  - artifacts/03-calendario.md exists
  - artifacts/04-publicacao.json exists
  - artifacts/06-compliance.json exists
  - human_gate_resolved on hitl

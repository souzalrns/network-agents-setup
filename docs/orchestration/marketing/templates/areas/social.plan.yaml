# Template — área Social & comunidade (P-90 = B, M-006)
#
# O líder da área (marketing.lider_social) decide e entrega o brief; os especialistas da área
# recebem-no como input. Passos sem dependência entre si correm em paralelo (motor LangGraph).

id: template-area-social
version: 1
deliverable_type: area_social
objective: "(preencher)"
audience: "(preencher)"

budget:
  max_steps: 5

steps:
  - id: lider
    action: lider_social
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/00-brief-social.md

  - id: comunidade
    action: community_marketing
    mode: events
    depends_on: [lider]
    task: "Evento para a comunidade segundo o brief"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md]
    output_artifact: artifacts/01-comunidade.md

  - id: criadores
    action: influencer_brief
    depends_on: [lider]
    task: "Brief para criadores locais"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md]
    output_artifact: artifacts/02-criadores.md

  - id: critic
    action: critic
    depends_on: [comunidade, criadores]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-social.md, artifacts/01-comunidade.md, artifacts/02-criadores.md]
    output_artifact: artifacts/03-critic.json

  - id: hitl
    action: plan_approve
    depends_on: [critic]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/04-hitl.json

done_when:
  - artifacts/00-brief-social.md exists
  - artifacts/01-comunidade.md exists
  - artifacts/02-criadores.md exists
  - human_gate_resolved on hitl

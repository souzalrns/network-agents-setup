# Template — área Inteligência (P-90 = B, M-006)
#
# O líder da área (marketing.lider_inteligencia) decide e entrega o brief; os especialistas da área
# recebem-no como input. Passos sem dependência entre si correm em paralelo (motor LangGraph).

id: template-area-inteligencia
version: 1
deliverable_type: area_inteligencia
objective: "(preencher)"
audience: "(preencher)"

budget:
  max_steps: 6

steps:
  - id: lider
    action: lider_inteligencia
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/00-brief-inteligencia.md

  - id: factos
    action: research
    depends_on: [lider]
    task: "Factos com fonte para as perguntas do brief"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-inteligencia.md]
    output_artifact: artifacts/01-factos.md

  - id: concorrentes
    action: competitor_profiling
    depends_on: [lider]
    task: "Perfis dos concorrentes indicados no brief"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-inteligencia.md]
    output_artifact: artifacts/02-concorrentes.md

  - id: tendencias
    action: trend_hunter
    depends_on: [lider]
    task: "Tendências e hooks relevantes para o público"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-inteligencia.md]
    output_artifact: artifacts/03-tendencias.md

  - id: critic
    action: critic
    depends_on: [factos, concorrentes, tendencias]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-inteligencia.md, artifacts/01-factos.md, artifacts/02-concorrentes.md, artifacts/03-tendencias.md]
    output_artifact: artifacts/04-critic.json

  - id: hitl
    action: plan_approve
    depends_on: [critic]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/05-hitl.json

done_when:
  - artifacts/00-brief-inteligencia.md exists
  - artifacts/01-factos.md exists
  - artifacts/02-concorrentes.md exists
  - artifacts/03-tendencias.md exists
  - human_gate_resolved on hitl

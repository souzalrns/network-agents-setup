# Template — área Anúncios (P-90 = B, M-006)
#
# O líder da área (marketing.lider_anuncios) decide e entrega o brief; os especialistas da área
# recebem-no como input. Passos sem dependência entre si correm em paralelo (motor LangGraph).
# Qualidade: critic e compliance (e, nos sites, a citabilidade por IA) revêem em paralelo antes da aprovação humana.

id: template-area-anuncios
version: 1
deliverable_type: area_anuncios
# Entrega para fora (terceiros ou publicação): anúncios com gasto de dinheiro
delivery: external
objective: "(preencher)"
audience: "(preencher)"

budget:
  max_steps: 6

steps:
  - id: lider
    action: lider_anuncios
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/00-brief-anuncios.md
    knowledge:
      kb: marketing
      query: "tráfego pago, plano de media e criativos de anúncios"

  - id: media
    action: media_plan
    depends_on: [lider]
    task: "Plano de media segundo o brief"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-anuncios.md]
    output_artifact: artifacts/01-media.md
    knowledge:
      kb: marketing
      query: "media buying e plano de media"

  - id: testes
    action: ab_testing
    depends_on: [media]
    task: "Desenho dos testes A/B da campanha"
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-anuncios.md, artifacts/01-media.md]
    output_artifact: artifacts/02-testes.md
    knowledge:
      kb: marketing
      query: "testes A/B de anúncios e métricas de desempenho"

  - id: critic
    action: critic
    depends_on: [testes]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-anuncios.md, artifacts/01-media.md, artifacts/02-testes.md]
    output_artifact: artifacts/03-critic.json
    knowledge:
      kb: marketing
      query: "rubrica de revisão criativa e critérios de qualidade"

  - id: compliance
    action: compliance_check
    depends_on: [testes]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/00-brief-anuncios.md, artifacts/01-media.md, artifacts/02-testes.md]
    output_artifact: artifacts/04-compliance.json
    knowledge:
      kb: marketing
      query: "regras de marca do cliente e conformidade legal da publicidade"

  - id: hitl
    action: plan_approve
    depends_on: [critic, compliance]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/05-hitl.json

done_when:
  - artifacts/00-brief-anuncios.md exists
  - artifacts/01-media.md exists
  - artifacts/02-testes.md exists
  - artifacts/04-compliance.json exists
  - human_gate_resolved on hitl

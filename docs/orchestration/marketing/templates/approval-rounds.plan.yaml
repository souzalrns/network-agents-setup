# Até 3 rodadas de revisão criativa (padrão ASV reescrito)
id: template-approval-rounds
version: 1
deliverable_type: approval_rounds
# Entrega para fora (terceiros ou publicação): peça aprovada em rondas e entregue ao cliente
delivery: external
objective: "(preencher — peça já existente em artifacts/00-draft.*)"

budget:
  max_steps: 12

steps:
  - id: review_r1
    action: creative_review
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/01-review-r1.json
    knowledge:
      kb: marketing
      query: "critérios de revisão criativa checklist"

  - id: hitl_r1
    action: plan_approve
    depends_on: [review_r1]
    human_gate:
      level: step
      kind: output_review
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/02-hitl-r1.json

  - id: revise_r2
    action: copy_answer_first
    depends_on: [hitl_r1]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/03-copy-r2.md
    knowledge:
      kb: marketing
      query: "escrita answer-first: resposta directa no topo para ser citada por IA"

  - id: review_r2
    action: creative_review
    depends_on: [revise_r2]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/04-review-r2.json
    knowledge:
      kb: marketing
      query: "critérios de revisão criativa checklist"

  - id: hitl_r2
    action: plan_approve
    depends_on: [review_r2]
    human_gate:
      level: step
      kind: confirmation
      allow: [approve, reject, edit]
    tools_allowed: []
    output_artifact: artifacts/05-hitl-r2.json

  - id: final_or_r3
    action: creative_review
    depends_on: [hitl_r2]
    tools_allowed: [read_repo_file]
    output_artifact: artifacts/06-review-final.json
    knowledge:
      kb: marketing
      query: "critérios de revisão criativa checklist"

  - id: revisao
    action: critic
    depends_on: [final_or_r3]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/03-copy-r2.md, artifacts/06-review-final.json]
    output_artifact: artifacts/08-revisao.json
    knowledge:
      kb: marketing
      query: "rubrica de revisão criativa e critérios de qualidade"

  - id: compliance
    action: compliance_check
    depends_on: [final_or_r3]
    tools_allowed: [read_repo_file]
    inputs: [artifacts/03-copy-r2.md, artifacts/06-review-final.json]
    output_artifact: artifacts/09-compliance.json
    knowledge:
      kb: marketing
      query: "regras de marca do cliente e conformidade legal da publicidade"

  - id: hitl_final
    action: plan_approve
    depends_on: [final_or_r3, revisao, compliance]
    human_gate:
      level: step
      kind: confirmation
      allow: [approve, reject]
    tools_allowed: []
    output_artifact: artifacts/07-hitl-final.json

done_when:
  - human_gate_resolved on hitl_final

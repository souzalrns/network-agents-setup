# D5: modelo por `model_tier` do passo (planner | executor | verifier).
# Lido pelo worker external (runner/plan_runner/model_tiers.py).
#
# `null` = usar o modelo normal do worker (AGENT_MODEL ou gemini-flash-lite-latest).
# Com tudo a null o comportamento é o de antes do D5. O DEV escolhe os modelos
# (o worker só fala com a Gemini API: o modelo tem de existir lá).
# Com `budget.max_cost_usd`, o modelo escolhido precisa de preço em config/model-prices.yaml.

tiers:
  planner: null
  executor: null
  verifier: null

# Sinal de complexidade (C1..C4) -> modelo, cheap->expensive. É o `complexity` que
# a planwright exporta (CANONICAL-SCENARIO.md), lido pela selecção do runner quando
# o passo NÃO declara `model_tier`. O `model_tier` (papel) manda sempre; a
# complexidade só preenche a lacuna — informa, nunca decide sozinha. Tudo a null =
# comportamento de antes (o sinal viaja mas não muda modelo nenhum).
complexity:
  C1: null
  C2: null
  C3: null
  C4: null

# Disponibilidade (A, ADR-002): modelos que o DEV confirma utilizáveis com a chave
# actual. VAZIO = sem restrição (comportamento de antes). Quando a lista não está
# vazia e um modelo escolhido pelo SINAL `complexity` não está nela, a selecção
# degrada para o modelo default (o sinal informa, nunca força, nunca parte o run).
# NÃO toca no `model_tier` explícito — esse é a escolha deliberada do DEV.
available: []

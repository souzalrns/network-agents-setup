# D5: modelo por `model_tier` do passo (planner | executor | verifier).
# Lido pelo worker external (runner/plan_runner/model_tiers.py).
#
# `null` = usar o modelo normal do worker (AGENT_MODEL ou gemini-flash-lite-latest).

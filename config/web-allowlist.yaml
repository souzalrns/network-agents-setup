# F2-ALLOW-1 (P-25 = A, maestro, 2026-10-07): domínios que o `fetch` (scripts/web_fetch.py)
# pode buscar, por área do config/areas.yaml. Validado no E7 (`python -m plan_runner.areas`).
#
# v1 dos domínios: escolhidos pelo maestro a 2026-10-08, aplicados tal como dados.
# - Domínio novo = decisão do maestro + linha no PENDENCIAS (§10), nunca uma edição silenciosa.
# - Lista vazia = deny-by-default nessa área (`software` fica assim na v1).
# - Cada domínio aceita também os subdomínios (`exemplo.com` aceita `*.exemplo.com`).
#   Nada de esquema, caminho, porta, `*` nem IP.
# - De fora de propósito na v1: as raízes gov.br e jus.br (só os órgãos listados), e as
#   notícias de finanças (Reuters, FT, Bloomberg). reddit e medium, se um dia entrarem, só
#   em `marketing`. Um domínio repetido entre áreas é intencional.
# - Os redirects contam: cada salto é verificado contra a lista da área, e um destino fora
#   dela falha com `blocked_by_allowlist`. A sonda `scripts/check_web_allowlist.py` (CI,
#   informativa) mostra para onde cada domínio redirecciona.
#
#   python scripts/web_fetch.py <url> --area research                 # domínios da área
#   python scripts/web_fetch.py <url> --area research --allow arxiv.org  # só estreita a área
#
# `--area` é obrigatória. Regras e uso: runner/plan_runner/web_allowlist.py e
# docs/ops/WEB-FETCH.md §2.1.


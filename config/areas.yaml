# Registo de áreas — v1 (J5 do docs/audit/PLANO-DE-ACAO.md; D2 de docs/audit/DECISAO-2-maestro.md)
#
# O que é: DADOS para o router hierárquico híbrido (D2). Primeiro escolhe-se a
# área (palavras-chave/embeddings); só dentro dela se escolhe o agente (LLM).
# Lido por runner/plan_runner/router.py (docs/ops/ROUTER.md).
#
# keywords[]: SEM acentos, em minúsculas. Até 5 caracteres casam só a palavra
#   inteira ("lei" não apanha "leitura"; por isso os plurais curtos vão à parte);
#   mais longas são radicais que casam no início de palavra ("contrat" apanha
#   contrato/contratos/contratual). Frases com espaço casam a partir do início
#   da 1.ª palavra ("pull request"). Uma keyword só pode estar numa área (E7).
# routing: limiares de confiança (0-1) e área de fallback quando nenhuma
#   keyword casa (G3 da D2).
#
# Referências:
#   - agents[] e horizontals[] usam o `id:` do frontmatter de agents/**/*.agent.md
#     (runtime Python, D1). Os IDs de config/agents.config.ts (TS, arquivado)
#     e os de agent-network-mcp/lib/agents.js (MCP de produção) NÃO entram na v1.
#   - `kind` (internal | external_ai | meta) está no AGENTE, não na área.
#   - Cada agente .agent.md aparece em exactamente uma lista agents[], para que
#     nenhum fique inalcançável.
#
# O que fica por decidir (cada ponto tem uma opção recomendada por omissão em
# docs/audit/PLANO-DE-ACAO.md, secção "Decisões tomadas vs. em aberto"):
#   1. ~~Validação em CI~~ FEITO (E7): runner/plan_runner/areas.py, corrido no
#      runner-tests.yml (`python -m plan_runner.areas`). Falha se um id não existir,
#      se um agente ficar órfão ou estiver em duas áreas.
#   2. Entrada das verticais do MCP de produção (ADR-M7). Omissão: fica para a v2.
#   3. budget por área: null ou {max_steps?, max_tokens?}. O max_tokens é o tecto de
#      tokens do pedido (router + passos), aplicado pelo worker a partir do ledger
#      (docs/ops/BUDGET.md). B5-bis fase 1 (2026-10-01, decisão do maestro, opção A):
#      produção 80k, risco 40k, exploratórias 30k, transversal 20k -- um freio, não
#      optimização; rever depois do B1-bis-C (encurtar skills/prompt-base).
#   5. grounding: full (omissão) | slim. slim = agents/_shared/grounding.slim.md, só em áreas
#      sem risco (B1-bis, docs/ops/WORKER-EXTERNAL.md). finance/legal/security ficam full.
#   4. Áreas sem agentes (legal, gamedev, docs): ficam declaradas com agents: []
#      e o router devolve "sem especialista" + HITL. Não se inventam agentes.

version: 1
status: v1

routing:
  area_min_confidence: 0.6    # margem da melhor área sobre a 2.ª; abaixo -> clarificação (ou HITL se houver área de risco)
  agent_min_confidence: 0.6   # confiança do LLM na escolha do agente/plano; abaixo -> clarificação (ou HITL na área de risco)
  fallback_area: horizontal   # sem nenhuma keyword (nem embeddings) -> esta área

areas:
  - id: software
    description: Desenvolvimento, arquitectura de agentes, qualidade de código e dados, UI/UX de produto.
    keywords: [codigo, programa, app, aplicac, aplicativ, site, frontend, backend, api, apis, bug, bugs, refactor, pull request, commit, tdd, testes unitarios, deploy, base de dados, sql, schema, typescript, javascript, python, ux, ui, wireframe, interface, ecra, tela, onboarding, componente, design system, arquitetura de agentes, produto digital]
    agents:
      - engenharia.desenvolvimento
      - engenharia.guia-tdd
      - engenharia.revisor-codigo
      - engenharia.qualidade-dados
      - meta.arquitetura-agentes
      - produto.produto-tech-transversal
      - design.ui
      - design.ux
      - design.ux_writer
      - design.design_critic
    horizontals: [meta.planejador, meta.using_agent_skills, meta.security-auditor]
    budget: {max_tokens: 80000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null

  - id: marketing
    description: Estratégia, copy, criativos, media, SEO/GEO, conteúdo e identidade visual.
    keywords: [marketing, instagram, tiktok, linkedin, facebook, post, posts, campanha, anuncio, publicidade, seo, conteudo, copy, slogan, influenc, ugc, marca, branding, identidade visual, logotipo, reels, newsletter, criativo, lancamento, colecao, trend, trends, hashtag, artigo, blog, storytelling, audiencia, promov]
    agents:
      - marketing.marketing
      - marketing.internal_brief
      - marketing.research
      - marketing.trend_hunter
      - marketing.seo_brief
      - marketing.copy_answer_first
      - marketing.copy_social
      - marketing.storytelling
      - marketing.ad_creative
      - marketing.creative_review
      - marketing.critic
      - marketing.critic_item13
      - marketing.content_analyst
      - marketing.editor_video
      - marketing.influencer
      - marketing.media_buyer
      - marketing.ugc
      - design.identidade-visual
    horizontals: [meta.planejador, meta.using_agent_skills]
    budget: {max_tokens: 80000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null
    grounding: slim   # B1-bis: directiva curta (agents/_shared/grounding.slim.md); risco fica full

  - id: legal
    description: Direito PT/BR (civil, contratos, jurisprudência). Sem agente .agent.md na v1.
    keywords: [contrat, juridic, direito, lei, leis, tribunal, advogad, clausul, jurisprud, processo judicial, litigio, arrendamento, rgpd, gdpr, notificacao judicial]
    agents: []
    horizontals: [meta.planejador]
    budget: {max_tokens: 40000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: required   # P-AG-118 (docs/estrutura-geral-agentes.md:156)

  - id: ops
    description: Gestão empresarial, operação e atendimento/comunicações com clientes.
    keywords: [cliente, atendimento, reclamac, email, emails, suporte, gestao, equipa, equipe, operac, recursos humanos, recrutamento, fornecedor, encomenda, procedimento]
    agents:
      - gestao.gestao-empresarial
      - atendimento.comunicacoes-atendimento
    horizontals: [meta.planejador, meta.using_agent_skills]
    budget: {max_tokens: 30000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null

  - id: research
    description: Pesquisa de ferramentas, repos e tecnologia (radar); pesquisa de nicho.
    keywords: [pesquis, ferramenta, radar, open source, repositor, compar, benchmark, estado da arte, alternativa, tecnologia, nicho]
    agents:
      - meta.radar-ferramentas
    horizontals: [meta.planejador]
    budget: {max_tokens: 80000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null
    grounding: slim   # B1-bis: directiva curta (agents/_shared/grounding.slim.md); risco fica full

  - id: finance
    description: Contabilidade PT/BR e análise financeira. Trading (G1/B3) ainda não existe.
    keywords: [contabil, balancete, iva, irs, imposto, fatura, financeir, orcament, despesa, lucro, fluxo de caixa, investiment, trading, bolsa, cripto, declaracao]
    agents:
      - gestao.contabilidade
    horizontals: [meta.planejador]
    budget: {max_tokens: 40000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: required   # P-AG-118 (docs/estrutura-geral-agentes.md:156); grounding (agents/_shared/grounding.directive.md:39)

  - id: gamedev
    description: Desenvolvimento de jogos (G2). Sem agentes na v1.
    keywords: [jogo, jogos, game, games, gamedev, unity, godot, jogador, nivel do jogo]
    agents: []
    horizontals: [meta.planejador]
    budget: {max_tokens: 30000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null

  - id: security
    description: Auditoria de segurança defensiva (código, dependências, MCP, CI). Nunca ofensiva.
    keywords: [seguranc, vulnerab, cve, owasp, auditoria de seguranca, auditoria, segredo, secrets, credencia, ataque, malware]
    agents:
      - meta.security-auditor
    horizontals: [meta.planejador]
    budget: {max_tokens: 40000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: required   # achados de segurança não são aceites sem sinalizar (agents/meta/security_auditor.agent.md)

  - id: docs
    description: Documentação, ADRs, relatórios. Sem agente .agent.md dedicado na v1.
    keywords: [documentac, adr, readme, relatorio, manual, wiki, changelog]
    agents: []
    horizontals: [meta.planejador]
    budget: {max_tokens: 80000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null
    grounding: slim   # B1-bis: directiva curta (agents/_shared/grounding.slim.md); risco fica full

  - id: horizontal
    description: Agentes transversais que servem todas as áreas (planeamento e descoberta de skills).
    keywords: [planeia, planear, planejar, quebra em passos, que skill, skills]
    agents:
      - meta.planejador
      - meta.using_agent_skills
    horizontals: []
    budget: {max_tokens: 20000}   # B5-bis fase 1 (folgado), rever depois do B1-bis-C
    hitl: null

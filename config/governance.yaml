# GOV-LOCAL-1 (P-93 = B): contrato local de governança. Lido por runner/plan_runner/governance_local.py.
#
# mode:
#   record  -> só regista um recibo por passo (hash encadeado em receipts.jsonl); nunca bloqueia.
#   enforce -> recusa o passo que a política não autorize (deny, ou approve sem gate humano no passo).
# default: o que decide quando nenhuma regra nem delegação se aplica. `deny` = fail-closed.
# rules: agent = `action` do passo; capability = `step:run` ou `tool:<nome>`. Aceita * e ?.
#        deny ganha a approve, que ganha a allow. Uma delegação válida (delegations.jsonl) dá allow, mas nunca vence um deny.
# max_delegation_depth: profundidade máxima da cadeia de delegação (1 a 10).
version: 1
mode: enforce
default: allow
max_delegation_depth: 3
rules:
  - { agent: "*", capability: "tool:shell*", effect: approve }
  - { agent: "*", capability: "tool:send_*", effect: approve }
  # G1.5 (P-95): nenhum passo do PCU envia, altera ou cancela ordens, mexe em saldos, limites ou chaves. A execução
  # (paper/testnet/live) vive no oss/economia-trader, com o seu portão (safety.py). `deny` ganha sempre, até a uma delegação.
  # Ler dados de mercado (`get_order_book`, `fetch_ticker`) continua permitido: as regras usam verbos de acção, não a palavra "order".
  - { agent: "*", capability: "tool:place_*", effect: deny }
  - { agent: "*", capability: "tool:create_order*", effect: deny }
  - { agent: "*", capability: "tool:submit_order*", effect: deny }
  - { agent: "*", capability: "tool:send_order*", effect: deny }
  - { agent: "*", capability: "tool:cancel_order*", effect: deny }
  - { agent: "*", capability: "tool:modify_order*", effect: deny }
  - { agent: "*", capability: "tool:amend_order*", effect: deny }
  - { agent: "*", capability: "tool:execute_order*", effect: deny }
  - { agent: "*", capability: "tool:execute_trade*", effect: deny }
  - { agent: "*", capability: "tool:close_position*", effect: deny }
  - { agent: "*", capability: "tool:set_leverage*", effect: deny }
  - { agent: "*", capability: "tool:*withdraw*", effect: deny }
  - { agent: "*", capability: "tool:transfer_*", effect: deny }
  - { agent: "*", capability: "tool:*api_key*", effect: deny }
  - { agent: "*", capability: "tool:*api_secret*", effect: deny }

# Escritório dos Agentes — mapa de lugares, v1 (OFFICE-A1; decisões do maestro de 2026-10-24:
# opção A = projecção de eventos reais; D1 = A, departamentos separados das áreas do router)
#
# O que é: a camada VISÍVEL por cima do motor. Duas alas:
#   - funcoes:  os departamentos de trabalho (Marketing, Comercial, Software, ...);
#   - negocios: uma sala por unidade de negócio, com os agentes que conhecem esse negócio.
# Os departamentos NÃO são as áreas de config/areas.yaml: o router continua a escolher pela
# área; o escritório só agrupa para pessoas lerem. Mudar um lugar aqui não mexe no routing.
#
# Regras (validadas por runner/plan_runner/office.py, corrido no runner-tests.yml):
#   - cada agente do runner (areas[].agents[] de config/areas.yaml) está em exactamente um
#     lugar do escritório: sem órfãos, sem duplicados, sem inventados;
#   - cada agente só do MCP de produção (config/mcp-agents.yaml com runtime: null) está em
#     exactamente um lugar, escrito `mcp:<id>`; os que existem nos dois sítios entram pelo
#     id do runner;
#   - lead: null ou um agente do próprio departamento. Só é Lead quem orquestra de facto
#     (marketing.marketing); não se inventam chefes decorativos;
#   - departments[].id e seats[].id únicos; wing = funcoes | negocios; name e does não vazios;
#   - theme: {color: "#RRGGBB", icon: <símbolo genérico>} dá a cor e o símbolo dos avatares
#     (os símbolos estão em runner/plan_runner/office_html.py; o core não conhece departamentos);
#   - um departamento sem agentes fica com seats: [] e o escritório mostra "sem agentes ainda".
#
# Nomes de lugar são FUNÇÕES, nunca nomes humanos: quem fala com o escritório tem de
# saber que fala com uma IA (AI Act, art. 50). A identificação "agente IA" é da UI.
#
# Estado de um lugar = o mais grave dos seus agentes; o de um departamento = o mais
# grave dos seus lugares (ordem e eventos em docs/ops/OFFICE.md).

version: 1

departments:

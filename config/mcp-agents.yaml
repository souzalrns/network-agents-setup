# Inventário dos agentes do MCP de produção (agent-network-mcp, lib/agents.js), v1 (OFFICE-A1)
#
# Para quê: o escritório mostra TODOS os agentes, incluindo os que só existem no MCP de
# produção (os que conhecem cada negócio). O runner não lê este ficheiro; o router também não.
#
# Campos:
#   id:      a chave em lib/agents.js (export AGENTS);
#   runtime: o id do mesmo agente no runner (agents/**/*.agent.md) quando existe nos dois
#            sítios; null quando só existe no MCP. Um agente com runtime aparece no escritório
#            pelo id do runner (uma vez só); um agente só do MCP aparece como `mcp:<id>`.
#
# Sincronização: este ficheiro é uma cópia dos ids de lib/agents.js em agent-network-mcp
# @ 388db8a (2026-10-24). Ao adicionar ou renomear um agente no MCP, actualizar aqui
# (a verificação automática entre os 2 repos é o item OFFICE-MCP-SYNC).
#
# Os agentes do MCP ainda não emitem eventos: no escritório aparecem "sem telemetria",
# nunca "à espera" como se soubéssemos (docs/ops/OFFICE.md §4).


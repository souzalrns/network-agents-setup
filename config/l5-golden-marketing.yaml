# Golden set do L5, pack de marketing (F3b-GS-1; P-34 = A).
#
# Mesmo formato e métricas do config/l5-golden-security.yaml (F0.7a): mede se o retrieve
# REAL devolve o excerto certo do pack `docs/knowledge/marketing/` (F3c, P-35 = A) para
# perguntas típicas da área. Mede retrieval relevante, não verdade (EXECUTION-PLAN §15.8).
#
# Porquê este pack: 16 dos 17 blocos `knowledge:` dos planos pedem `kb: marketing`, e até
# aqui não havia nenhum caso de avaliação de marketing. A kb `marketing` tem mais ~30
# fontes (copywriter.md, ai-findability.md, item-13-...), várias sobre o mesmo tema: o
# `source_hit` mede também se o pack ganha a essas fontes vizinhas.
#
# Usado em dois sítios:
#   - runner/tests/test_l5_golden_marketing.py (offline, sem rede): cada âncora cai em
#     EXACTAMENTE um chunk da fonte do caso (chunking real) e a pergunta não copia a âncora;
#   - `python -m plan_runner.l5_eval run --golden config/l5-golden-marketing.yaml`: mede
#     contra o MCP real (MCP_URL + MCP_API_KEY; o DEV). Gasta 20 embeddings de pergunta.
#
# Cada caso tem a sua `source` (o pack tem 7 ficheiros); a de topo é só a omissão.
# Perguntas parafraseadas de propósito, como no golden de security.

version: 1
kb: marketing                                  # = agent_id no knowledge_chunks
source: docs/knowledge/marketing/multi-ai-findability.md
k: 4                                           # = match_count por omissão do match_knowledge

cases:

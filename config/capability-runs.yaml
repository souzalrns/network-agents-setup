# Runs reais registados: a evidência do nível PROVEN da maturidade das capabilities
# (F4-MAT-1, P-38 = B; EXECUTION-PLAN §15.7: "PROVEN = evidência E2E com run real").
#
# Isto NÃO declara a maturidade de nenhuma capability: regista runs que aconteceram, e o
# E7 (`python -m plan_runner.areas`) verifica cada um contra o documento de evidência
# (o documento tem de conter o `anchor`, o nome do plano e o `run_id`, se houver).
# A maturidade é calculada em runner/plan_runner/capabilities.py (capability_maturity):
# um plano com um run `passed` aqui faz PROVEN as capabilities `implemented` cujas
# actions ele usa, se já estiverem VALIDATED.
#
# Só runs com o provider real (`worker: gemini`). Os directórios dos runs não estão no
# git (pilots/f5-run*/, pilots/run-*): a evidência é o documento citado.


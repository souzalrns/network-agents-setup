      - test_mcp_knowledge.py::test_retrieve_raises_on_empty_response
      - test_mcp_knowledge.py::test_retrieve_passes_kb_query_topk_and_require_citations
    runs:
      - {doc: *close27, anchor: "| MCP-V3 | F3b-AUTH-1 | **PASS**"}

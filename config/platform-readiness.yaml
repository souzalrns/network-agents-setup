      - test_tool_executor.py::test_read_repo_file_le_e_recusa_segredos
      - test_tool_executor.py::test_args_invalidos_sao_recusados_antes_de_executar
      - test_web_allowlist.py::test_v1_deny_by_default_e_exclusoes_de_proposito
      - test_f2_fetch_tool.py::test_plano_de_demonstracao_e_valido_e_usa_a_tool_com_area
    runs:

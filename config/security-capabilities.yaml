# Cyber Security capabilities v1 — Capability First
# Não são agentes. O plan_runner corre actions; skills/profiles implementam.
# Ver docs/architecture/SECURITY-AGENTS.md

version: 1
domain: security
policy:
  offensive: forbidden
  act_in_production: forbidden
  default_level: read
  hitl: required

capabilities:
  - id: triage
    description: Classificar severidade e superfícies; decidir needs_full_audit.
    levels: [read]
    action: security_triage
    agent: security.triage
    skill: skills/security/triage/SKILL.md
    status: implemented

  - id: defensive_audit
    description: Auditoria defensiva OWASP LLM 2026 / NIST / ATLAS / MAESTRO.
    levels: [read]
    action: security_audit
    agent: meta.security-auditor
    skill: skills/meta/security-audit/SKILL.md
    status: implemented

  - id: security_report
    description: Consolidar findings em relatório estruturado.
    levels: [read, prepare]
    action: security_report
    agent: security.reporter
    skill: skills/security/reporter/SKILL.md
    status: implemented

  - id: secrets_hygiene
    description: Detecção e orientação sobre segredos (Gitleaks / review).
    levels: [read]
    action: security_audit
    agent: meta.security-auditor
    skill: skills/meta/security-audit/SKILL.md
    tools_guidance: [gitleaks]
    status: partial  # skill audit no runner + gitleaks no CI (SEC-2, .github/workflows/security-scan.yml)

  - id: sast
    description: Análise estática de código (SAST) em Python e multilinguagem.
    levels: [read]
    action: security_audit
    agent: meta.security-auditor
    skill: skills/meta/security-audit/SKILL.md
    tools_guidance: [semgrep, codeql, bandit]
    status: partial  # semgrep + CodeQL no CI (SEC-2); bandit no CI (SEC-SUITE-1, P-48)

  - id: workflow_security
    description: Segurança dos workflows do GitHub Actions (injecção, permissões, pinning).
    levels: [read]
    action: security_audit
    agent: meta.security-auditor
    skill: skills/meta/security-audit/SKILL.md
    tools_guidance: [zizmor, actionlint]
    status: partial  # zizmor no CI (SEC-SUITE-1, P-48); actionlint usado na revisão

  - id: supply_chain
    description: Dependências e imagens (pip-audit no CI; OSV/Trivy guidance).
    levels: [read]
    action: security_audit
    agent: meta.security-auditor
    skill: skills/meta/security-audit/SKILL.md
    tools_guidance: [pip-audit, osv-scanner, trivy]
    status: partial  # pip-audit no CI (SEC-SUITE-1, P-48, bloqueia); OSV/Trivy (binários Go) ficam para SEC-SCA-2

  - id: mcp_surface
    description: Superfície MCP / tools / excessive agency (LLM01, LLM03).
    levels: [read]
    action: security_audit
    agent: meta.security-auditor
    skill: skills/meta/security-audit/SKILL.md
    status: partial

  - id: hardening_recommend
    description: Recomendações de hardening (PREPARE); ACT só engenharia pós-HITL.
    levels: [prepare]
    action: security_report
    agent: security.reporter
    skill: skills/security/reporter/SKILL.md
    status: partial  # via next_steps do report

  - id: agent_redteam_lab
    description: Red-team dos próprios agentes (PyRIT/DeepTeam) em lab/CI isolado.
    levels: [lab]
    action: null
    agent: null
    skill: null
    status: deferred  # proibido no runner de produção

  - id: external_pentest_lab
    description: >-
      Pentest externo com o Strix (usestrix/strix, Apache-2.0): corre a aplicação,
      procura falhas OWASP e confirma-as com prova de conceito. Só em lab/CI isolado,
      contra repos próprios e com autorização; nunca no runner de produção.
    levels: [lab]
    action: null
    agent: null
    skill: null
    status: deferred  # P-47 = A: piloto em CI manual (workflow_dispatch), fora do runner

  - id: llm_redteam_lab
    description: >-
      Red-team de LLM/agentes com Garak (NVIDIA) e promptfoo: prompt injection,
      jailbreak, fuga de dados (OWASP LLM, ATLAS). Só em lab/CI manual, com chave
      de LLM e custo medido; nunca no runner de produção.
    levels: [lab]
    action: null
    agent: null
    skill: null
    status: deferred  # P-48 = A: workflow manual llm-redteam-lab.yml, fora do runner

# Golden set do L5, pack de security (F0.7a; docs/architecture/EXECUTION-PLAN.md §7, F0).
#
# Para que serve: medir se o retrieve REAL (agent-network-mcp → match_knowledge →
# knowledge_chunks) devolve o excerto certo do pack para perguntas típicas da área.
# Mede retrieval relevante, não verdade: "retrieval relevante ≠ retrieval válido"
# (EXECUTION-PLAN §15.8). Ver `stale:` abaixo.
#
# Usado em dois sítios:
#   - runner/tests/test_l5_eval.py (offline, sem rede): valida o próprio golden set
#     contra o chunking real do pack (cada âncora tem de cair em EXACTAMENTE um chunk
#     da fonte esperada) e prova as métricas com um backend falso;
#   - `python -m plan_runner.l5_eval run` (F0.7b): mede contra o MCP real. Precisa de
#     MCP_URL + MCP_API_KEY (credenciais autorizadas; o DEV ou o CI com segredos).
#     Antes do F0.4 (pack ingerido com agent_id `security`) o resultado esperado é
#     hit@k = 0: o pack ainda não está no `knowledge_chunks` (scripts/ingest_delta.py).
#
# Métricas (por pergunta, sobre os primeiros k hits devolvidos):
#   - hit de fonte: algum hit tem `citation.source` == `source`;
#   - hit de chunk: algum hit dessa fonte contém a `anchor` (comparação sem maiúsculas
#     e com espaços normalizados). A âncora identifica o chunk de forma estável entre
#     re-ingestões; os ids e o `chunk_index` podem mudar quando o ficheiro muda;
#   - rank do primeiro hit de chunk (para MRR) e hit@1 / hit@3 / hit@k;
#   - proveniência presente: todos os hits trazem `citation.source` não vazio.
# As perguntas estão parafraseadas de propósito (não copiam o título da secção):
# medem procura semântica, não correspondência literal.

version: 1
kb: security                                   # = agent_id no knowledge_chunks (lib/knowledge.js do MCP)
source: docs/knowledge/security-agents-stack.md
k: 4                                           # = match_count por omissão do match_knowledge (agent-network-mcp/memory/schema.sql:48)


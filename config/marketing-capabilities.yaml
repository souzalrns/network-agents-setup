# Marketing capabilities v1 — Capability First (F4, segundo domínio, espelho de security)
# Não são agentes. O plan_runner corre actions; skills/agents implementam.
# Validado no E7 (python -m plan_runner.areas): agente, skill e action têm de bater e
# existir; `implemented` exige pelo menos 1 plano do runner com a action
# (docs/orchestration/**/*.plan.yaml) — a maturidade é medida, não declarada.
# Ver docs/orchestration/marketing/ e docs/knowledge/marketing/.

version: 1
domain: marketing
policy:
  offensive: forbidden          # nada de spam, scraping agressivo, contas falsas ou manipulação
  act_in_production: forbidden  # publicar, gastar media ou enviar a clientes é sempre humano
  default_level: prepare        # o domínio prepara peças; um humano aprova e publica
  hitl: required                # os planos de marketing têm gates `plan_approve` antes de publicar


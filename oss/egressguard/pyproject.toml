[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egressguard"
version = "0.1.0"
description = "A safe HTTP GET with the guardrails most clients leave to you: a deny-by-default domain allowlist, SSRF protection, robots.txt, and hard caps on size, time and redirects — re-checked on every redirect hop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LRNSdigital" }]
keywords = [
  "ssrf", "allowlist", "http", "security", "fetch", "robots", "safe-fetch",
  "agents", "deny-by-default", "httpx",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
# One runtime dependency: a maintained HTTP client with per-hop redirect control and
# streaming (needed to enforce the caps and re-check every hop). The guards themselves
# (allowlist, SSRF, robots) are pure stdlib.
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
egressguard = "egressguard.cli:main"

[project.urls]
Repository = "https://github.com/souzalrns/network-agents-setup/tree/main/oss/egressguard"
Issues = "https://github.com/souzalrns/network-agents-setup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
egressguard = ["py.typed"]  # PEP 561: ships its own types

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # intentional unicode arrows/dashes in messages

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S108", "S310"]

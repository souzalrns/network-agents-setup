[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenwright"
version = "0.1.0"
description = "A token-cost ledger and a budget cap that refuses BEFORE you spend: fail-closed on an unknown model price, and a projective guard that blocks the next call when it would cross the cap. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LRNSdigital" }]
keywords = ["llm", "tokens", "cost", "budget", "pricing", "agents", "fail-closed", "ledger", "guardrail", "spend"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: Office/Business :: Financial",
]
# Zero runtime dependencies: prices are a plain mapping, the engine is pure stdlib.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tokenwright = "tokenwright.cli:main"

[project.urls]
Repository = "https://github.com/souzalrns/network-agents-setup/tree/main/oss/tokenwright"
Issues = "https://github.com/souzalrns/network-agents-setup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tokenwright = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

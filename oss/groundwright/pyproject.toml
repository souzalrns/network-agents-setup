[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groundwright"
version = "0.1.0"
description = "A retrieval grounding gate: for a golden set, check that retrieval returns the expected source (provenance) and the anchor chunk, and that the run stays above a regression threshold. Not answer-quality eval — the step before it. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LRNSdigital" }]
keywords = ["rag", "retrieval", "provenance", "grounding", "evaluation", "regression-gate", "citations", "agents", "golden-set", "source-attribution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero runtime dependencies: the golden set is a mapping, the retriever is a callable you
# pass in, and the engine is pure stdlib.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
groundwright = "groundwright.cli:main"

[project.urls]
Repository = "https://github.com/souzalrns/network-agents-setup/tree/main/oss/groundwright"
Issues = "https://github.com/souzalrns/network-agents-setup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
groundwright = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]

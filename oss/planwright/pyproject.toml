[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planwright"
version = "0.1.0"
description = "A maker of plans: turn a Markdown plan into what's ready, what runs in parallel, and the critical path. Plain data, zero dependencies, pluggable into any project or agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LRNSdigital" }]
keywords = [
  "project-management", "planning", "wbs", "critical-path", "dependencies",
  "scheduling", "claude-code", "plugin", "agents", "markdown",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Office/Business :: Scheduling",
]
# Zero runtime dependencies: the plan is Markdown, the engine is pure stdlib.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
planwright = "planwright.cli:main"

[project.urls]
Repository = "https://github.com/souzalrns/network-agents-setup/tree/main/oss/planwright"
Issues = "https://github.com/souzalrns/network-agents-setup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planwright = ["py.typed"]  # PEP 561: ships its own types

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # intentional unicode arrows/dashes in messages

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "S603"]
"scripts/**" = ["S101"]

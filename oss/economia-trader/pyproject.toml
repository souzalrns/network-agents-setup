[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "economia-trader"
version = "0.1.0"
description = "An auditable trading core for AI agents: agents propose, a deterministic risk engine and an execution gate decide (paper by default; Bybit testnet / Alpaca paper account; real orders behind a kill switch, a no-withdraw key check and per-order human approval), and every step lands in a hash-chained journal. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LRNSdigital" }]
keywords = ["trading", "agents", "risk", "paper-trading", "bybit", "mexc", "alpaca", "stocks", "kill-switch", "audit", "llm", "crypto"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Zero core dependencies. Exchanges come from mature libraries as extras: [crypto] ccxt, [stocks] alpaca-py.
dependencies = []

[project.optional-dependencies]
hitl = ["hitlwright>=0.1"]
# Mature libraries for the exchange adapters (the core stays zero-dependency).
crypto = ["ccxt>=4.5.85"]  # ccxt pins multidict==6.7.1 (CVE-2026-104874, server-side only): REUSE-AUDIT.md
stocks = ["alpaca-py>=0.44"]
# News + macro calendar on OpenBB, lean (core + news + bls: ~71 packages, no openbb-federal-reserve/diskcache).
data = ["openbb-core>=2.0.1", "openbb-news>=2.0", "openbb-bls>=2.0"]
tracing = ["langfuse>=3"]
# More evidence (P-59/P-62/P-63): SEC Form 4 insiders, FinBERT news sentiment, Adanos social sentiment.
sec = ["edgartools>=5.62"]
nlp = ["transformers>=4.44", "torch>=2.4"]
sentiment = ["adanos>=2.7"]
# Forecast confirm (P-68): Kronos is not on PyPI; clone shiyu-coder/Kronos @ 67b630e and pass --kronos-repo.
forecast = ["torch>=2.4", "pandas>=2.2", "einops>=0.8", "huggingface_hub>=0.33", "safetensors>=0.6", "tqdm>=4.67"]  # optional: agent traces in Langfuse (env-gated, see analysts.langfuse_handler)
# LLM analysts: TradingAgents is not on PyPI; install the audited commit (see analysts.py):
#   pip install 'git+https://github.com/TauricResearch/TradingAgents@1394a3f'

test = ["pytest>=8", "ccxt>=4.5.85", "alpaca-py>=0.44"]

[project.scripts]
economia-trader = "economia_trader.cli:main"

[project.urls]
Repository = "https://github.com/souzalrns/network-agents-setup/tree/main/oss/economia-trader"
Issues = "https://github.com/souzalrns/network-agents-setup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
economia_trader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

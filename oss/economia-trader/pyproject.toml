[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "economia-trader"
version = "0.1.0"
description = "An auditable trading core for AI agents: agents propose, a deterministic risk engine and an execution gate decide (paper by default; Bybit testnet / Alpaca paper account; real orders behind a kill switch, a no-withdraw key check and per-order human approval), and every step lands in a hash-chained journal. Zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "LRNSdigital" }]
keywords = ["trading", "agents", "risk", "paper-trading", "bybit", "mexc", "alpaca", "stocks", "kill-switch", "audit", "llm", "crypto"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
]
# Zero core dependencies. Exchanges come from mature libraries as extras: [crypto] ccxt, [stocks] alpaca-py.
dependencies = []

[project.optional-dependencies]
hitl = ["hitlwright>=0.1"]
# Mature libraries for the exchange adapters (the core stays zero-dependency).
crypto = ["ccxt>=4.5.85"]  # ccxt pins multidict==6.7.1 (CVE-2026-104874, server-side only): REUSE-AUDIT.md
stocks = ["alpaca-py>=0.44"]
test = ["pytest>=8", "ccxt>=4.5.85", "alpaca-py>=0.44"]

[project.scripts]
economia-trader = "economia_trader.cli:main"

[project.urls]
Repository = "https://github.com/souzalrns/network-agents-setup/tree/main/oss/economia-trader"
Issues = "https://github.com/souzalrns/network-agents-setup/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
economia_trader = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]

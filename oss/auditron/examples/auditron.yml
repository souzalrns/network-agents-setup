# Exemplo acoplável: copiar para `.github/workflows/` de qualquer repo.
# Corre o gate defensivo do auditron e, opcionalmente, envia o SARIF para o code scanning.
# Actions fixadas por SHA (muda os pins para os mais recentes no teu repo).

name: auditron

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  security-events: write # só para o upload-sarif; tira se não usares code scanning

concurrency:
  group: auditron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auditron:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install auditron
        run: python -m pip install auditron==0.1.0
      - name: Scan (sai 1 se um engine bloqueante encontrar algo)
        run: auditron scan . --sarif auditron.sarif
      - name: Upload SARIF (opcional)
        if: always()
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.29.0
        with:
          sarif_file: auditron.sarif
